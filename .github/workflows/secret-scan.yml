name: Secret Scan

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

jobs:
  gitleaks:
    runs-on: ubuntu-latest
    # gitleaks-action@v2 lee los commits del PR via API — sin este permiso
    # explícito el GITHUB_TOKEN restringido devuelve 403 y el check sale rojo
    # en todos los PRs (sin que haya ninguna fuga real).
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run Gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
